name: Import portfolio
on:
  push:
    paths:
      - '.github/workflows/import.yml'
      - 'migration-manifest.json'
      - 'scripts/import_portfolio.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy and verify original portfolio
        run: python3 scripts/import_portfolio.py
      - name: Save portfolio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css app.js favicon.svg assets .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Import complete portfolio with verified media assets"
            git push
          fi
